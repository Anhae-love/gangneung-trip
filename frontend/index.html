<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강릉 여행 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 한 줄 헤더 + 장소 추가 바 + 일차별 세로 타임라인(넓은 화면에선 열로 나란히) */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --ink:#102C3A; --muted:#5C727C; --line:#D3DFE2;
  --sea:#1B5E86; --sea-soft:#DCEAF2; --pine:#2F6B52; --pine-soft:#DDEDE4; --sun:#C9762A; --sun-soft:#F6E6D3;
  --danger:#B23A35;
  --land:#F3F6F1; --sea-fill:#C9DFEA; --road:#E2E6DF; --on-dot:#FFFFFF;
  --d0:#8A9AA1; --d1:#1B5E86; --d2:#C9762A; --d3:#2F6B52; --d4:#8A4A8C; --d5:#B23A35;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A21; --surface:#132631; --ink:#E4EEF1; --muted:#90A6AF; --line:#24404D;
  --sea:#6FB2DA; --sea-soft:#183A4D; --pine:#7CC3A0; --pine-soft:#1A3A2E; --sun:#E8A45F; --sun-soft:#3B2C1C;
  --danger:#EE7B73; --land:#162D38; --sea-fill:#0B2230; --road:#1E3A46; --on-dot:#0C1A21;
  --d0:#6F858E; --d1:#6FB2DA; --d2:#E8A45F; --d3:#7CC3A0; --d4:#C792C9; --d5:#EE7B73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A21; --surface:#132631; --ink:#E4EEF1; --muted:#90A6AF; --line:#24404D;
  --sea:#6FB2DA; --sea-soft:#183A4D; --pine:#7CC3A0; --pine-soft:#1A3A2E; --sun:#E8A45F; --sun-soft:#3B2C1C;
  --danger:#EE7B73; --land:#162D38; --sea-fill:#0B2230; --road:#1E3A46; --on-dot:#0C1A21;
  --d0:#6F858E; --d1:#6FB2DA; --d2:#E8A45F; --d3:#7CC3A0; --d4:#C792C9; --d5:#EE7B73; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--sea);margin-bottom:6px}
.trip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.trip label{display:flex;align-items:center;gap:6px}
.trip input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.trip input[type=number]{width:60px}
.status{font-size:12px;color:var(--muted)}

.add{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.add form{display:grid;grid-template-columns:2fr 1fr 1fr 90px 2fr auto auto;gap:8px}
.fcand{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;border:1px dashed var(--line);border-radius:6px;padding:0 10px;cursor:pointer}
.fcand:has(input:checked){border-color:var(--sun);color:var(--sun)}
.add input,.add select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.btn{background:var(--sea);color:var(--surface);border:0;border-radius:6px;padding:9px 16px;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--ink)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ideas span.lbl{color:var(--muted);margin-right:4px}
.chip{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--sea);color:var(--sea)}
@media (max-width:820px){.add form{grid-template-columns:1fr 1fr}.add form .name,.add form .memo{grid-column:1/-1}.add form .btn{grid-column:1/-1}.fcand{padding-block:8px}}

/* Carousel: 항상 한 번에 한 일차씩 넘어가는 swipe carousel */
.board-wrap{position:relative}
.carousel-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.carousel-nav .day-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.carousel-arrow{background:var(--surface);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,border-color .15s}
.carousel-arrow:hover:not(:disabled){background:var(--sea-soft);border-color:var(--sea)}
.carousel-arrow:disabled{opacity:.3;cursor:default}
.board{display:flex;overflow:hidden;scroll-snap-type:x mandatory;gap:0;align-items:start;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;user-select:none}
.board.dragging{cursor:grabbing;scroll-behavior:auto}
.board::-webkit-scrollbar{display:none}
.board .day{flex:0 0 100%;scroll-snap-align:start;min-width:0;padding:0 2px}
.day{display:flex;flex-direction:column;gap:8px;min-width:0}
.day h2{font-family:var(--display);font-size:20px;margin:0;display:flex;align-items:baseline;gap:8px}
.day h2 .date{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.day h2 .n{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.undecided h2{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px;border-left:2px solid var(--line);padding-left:12px;min-height:44px}
.empty{font-size:13px;color:var(--muted);padding:10px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card.open{border-color:var(--sea)}
.row{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;width:100%;background:none;border:0;text-align:left}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:38px;flex:none;padding-top:2px}
.main{flex:1;min-width:0}
.pname{font-weight:600;overflow-wrap:anywhere}
.pmemo{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.card.open .pmemo{white-space:normal;overflow-wrap:anywhere}
.cat{flex:none;font-size:11px;font-weight:600;border-radius:4px;padding:2px 6px;margin-top:2px}
.c-관광{background:var(--sea-soft);color:var(--sea)}
.c-맛집{background:var(--sun-soft);color:var(--sun)}
.c-카페{background:var(--sun-soft);color:var(--sun)}
.c-숙소{background:var(--pine-soft);color:var(--pine)}
.c-기타{background:var(--bg);color:var(--muted)}
.cand-b{font-size:11px;font-weight:600;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.card.cand .pname{color:var(--muted)}
.candrow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.approx{font-size:12px;color:var(--sun);background:var(--sun-soft);border-radius:6px;padding:6px 8px}
.locbtns{display:inline-flex;align-items:center;gap:6px}
.linkish{background:none;border:0;padding:4px 2px;font-size:12px;color:var(--muted);text-decoration:underline}
.has-info{width:6px;height:6px;border-radius:50%;background:var(--pine);display:inline-block;margin-left:6px;vertical-align:middle}

.detail{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 100px;gap:8px}
.fields select,.fields input,.detail textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.detail textarea{resize:vertical;min-height:54px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{color:var(--sea);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px}
.links a:hover{border-color:var(--sea)}
.info{background:var(--bg);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.info dt{color:var(--muted);font-size:12px;white-space:nowrap}
.info dd{margin:0;overflow-wrap:anywhere}
.info .sum{margin:0}
.info .note{font-size:11px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.danger{color:var(--danger);border-color:var(--line)}
.by{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

@media (max-width:700px){
  .carousel-arrow{width:30px;height:30px}
}
@media (max-width:600px){
  .board .day{padding:0}
}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.maphead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.maphead h2{font-family:var(--display);font-size:18px;margin:0 8px 0 0}
.dchip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-variant-numeric:tabular-nums}
.dchip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.dchip .km{color:var(--muted);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.mapwrap{position:relative;background:var(--sea-fill)}
#map svg{display:block;width:100%;height:auto;max-height:72vh}
#map .mk{cursor:pointer}
#map.picking svg{cursor:crosshair;outline:3px solid var(--sun);outline-offset:-3px}
.mapnote button{margin-left:6px}
#map .mk:focus-visible circle{stroke:var(--ink);stroke-width:3}
#map .pl{font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
#map .ref{font-size:12px;fill:var(--muted)}
#map .sea-l{font-family:var(--display);font-size:22px;fill:var(--sea);opacity:.55;letter-spacing:.3em}
.mapnote{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.daytabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:-6px}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.daytabs button[aria-current="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
@media (max-width:600px){
  .wrap{padding-block:14px 48px;gap:14px}
  header{padding-bottom:10px;gap:8px}
  h1{font-size:24px}
  h1 small{margin-bottom:2px}
  .trip{font-size:12px;gap:8px}
  .add{padding:10px;gap:8px}
  .add form{grid-template-columns:1fr 1fr 84px auto;gap:6px}
  .add form .name{grid-column:1/-1}
  #fDay{order:1}#fCat{order:2}#fTime{order:3}.fcand{order:4}.add form .memo{order:5}.add form .btn{order:6}
  .add form .memo{grid-column:1/4}
  .add form .btn{grid-column:4/5;padding-inline:12px}
  .add input,.add select{padding:7px 8px;font-size:14px}
  .fcand{padding:0 8px;font-size:13px}
  .ideas{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .ideas::-webkit-scrollbar{display:none}
  .ideas .chip{flex:none}
  .ideas span.lbl{flex:none}
  .day{gap:4px}
  .day h2{font-size:17px}
  .list{padding-left:8px}
  .row{padding:6px 9px;gap:6px}
  .pname{font-size:14px}
  .time{width:34px;font-size:11px}
  .cat{font-size:10px;padding:1px 5px}
  .detail{padding:10px;gap:8px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><small>GANGNEUNG · 동해</small>강릉 여행 계획</h1>
    <div class="trip">
      <label for="start">출발일 <input type="date" id="start"></label>
      <label for="days">일정 <input type="number" id="days" min="1" max="10" value="2"> 일</label>
      <span class="status" id="status">불러오는 중…</span>
    </div>
  </header>

  <section class="add" aria-label="장소 추가">
    <form id="addForm" autocomplete="off">
      <input class="name" id="fName" placeholder="가고 싶은 곳 (예: 안목해변 커피거리)" required maxlength="60">
      <select id="fDay" aria-label="일차"></select>
      <select id="fCat" aria-label="종류">
        <option>관광</option><option>맛집</option><option>카페</option><option>숙소</option><option>기타</option>
      </select>
      <input id="fTime" type="time" aria-label="시간">
      <input class="memo" id="fMemo" placeholder="메모 (선택)" maxlength="200">
      <label class="fcand" for="fCand"><input type="checkbox" id="fCand"> 후보</label>
      <button class="btn" id="addBtn">추가</button>
    </form>
    <div class="ideas" id="ideas"><span class="lbl">강릉에서 많이 가는 곳</span></div>
  </section>

  <nav class="daytabs" id="dayTabs" aria-label="일차 이동"></nav>
  <div class="board-wrap">
    <div class="carousel-nav" id="carouselNav">
      <button class="carousel-arrow" id="arrowPrev" aria-label="이전 일차" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="day-count" id="dayCount">1 / 2</span>
      <button class="carousel-arrow" id="arrowNext" aria-label="다음 일차">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <main class="board" id="board"></main>
  </div>

  <section class="mapbox" aria-label="지도">
    <div class="maphead" id="mapHead"><h2>지도</h2></div>
    <div class="mapwrap" id="map"></div>
    <div class="mapnote" id="mapNote">추가한 장소가 일차별 색으로 표시되고, 같은 날 장소는 시간순으로 이어져요. 거리는 직선 거리예요.</div>
  </section>

</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
const IDEAS=[["경포해변","관광"],["안목해변 커피거리","카페"],["오죽헌","관광"],["정동진","관광"],["주문진 수산시장","맛집"],["초당순두부마을","맛집"],["강문해변","관광"],["경포호","관광"],["강릉중앙시장","맛집"],["선교장","관광"],["하슬라아트월드","관광"],["사천해변","관광"]];
const CATS=["관광","맛집","카페","숙소","기타"];
// 대략적인 좌표 (위도, 경도)
const KNOWN={"경포해변":[37.8055,128.9086],"안목해변":[37.7727,128.9475],"안목해변 커피거리":[37.7727,128.9475],"오죽헌":[37.7792,128.8786],"정동진":[37.6905,129.0342],"주문진 수산시장":[37.8936,128.8268],"주문진":[37.8936,128.8268],"초당순두부마을":[37.7905,128.915],"강문해변":[37.7958,128.9185],"경포호":[37.7955,128.8985],"강릉중앙시장":[37.7545,128.899],"선교장":[37.7865,128.888],"하슬라아트월드":[37.7035,129.0175],"사천해변":[37.8412,128.8775],"강릉역":[37.7642,128.8995],"경포대":[37.7958,128.8945],"월화거리":[37.7605,128.8985],"테라로사":[37.7155,128.8705],"강릉 테라로사":[37.7155,128.8705],"아르떼뮤지엄 강릉":[37.7845,128.9085],"영진해변":[37.8635,128.8445]};
const COAST=[[38.05,128.70],[37.95,128.78],[37.905,128.822],[37.893,128.832],[37.87,128.848],[37.843,128.878],[37.82,128.895],[37.806,128.91],[37.795,128.921],[37.783,128.935],[37.772,128.949],[37.765,128.958],[37.752,128.975],[37.735,128.998],[37.715,129.015],[37.69,129.036],[37.675,129.048],[37.655,129.052],[37.62,129.075],[37.58,129.10],[37.50,129.16]];
const RIVER=[[37.745,128.80],[37.752,128.86],[37.760,128.90],[37.766,128.93],[37.769,128.951]];
const REFS=[["주문진",37.899,128.818],["경포",37.812,128.898],["강릉역",37.7642,128.8995],["정동진",37.697,129.022],["안인",37.738,128.985]];
const okCoord=(a,b)=>typeof a==="number"&&typeof b==="number"&&a>33&&a<39&&b>124&&b<132;
const near=p=>p.lat>37.3&&p.lat<38.3&&p.lng>128.3&&p.lng<129.5;
function known(name){const n=name.replace(/\s+/g,"");for(const k in KNOWN)if(k.replace(/\s+/g,"")===n)return KNOWN[k];for(const k in KNOWN)if(n.includes(k.replace(/\s+/g,"")))return KNOWN[k];return null}
function km(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const DAYC=d=>d===0?"var(--d0)":`var(--d${((d-1)%5)+1})`;
let mapDay="all", pickId=null, proj=null;
const isStay=p=>p.cat==="숙소";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db=null, user=null, sample=null, myId=null;
let places=[], trip={days:2,start:""}, openId=null, busy={}, names={}, readOnly=false;

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function dayLabel(d){
  if(d===0) return {t:"미정",date:""};
  let date="";
  if(trip.start){const x=new Date(trip.start+"T00:00:00");x.setDate(x.getDate()+d-1);

function syncTabs(){

function carouselTo(idx){

function carouselDelta(delta){

// 마우스 드래그 (데스크톱)
{
  let startX=0,startScroll=0,dragging=false,moved=false;
  $("#board").addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    // 카드 내부 버튼/input 등은 드래그 무시
    if(e.target.closest("button,input,select,textarea,a"))return;
    dragging=true;moved=false;startX=e.clientX;startScroll=$("#board").scrollLeft;
    $("#board").classList.add("dragging");
  });
  window.addEventListener("mousemove",e=>{
    if(!dragging)return;
    const dx=e.clientX-startX;
    if(Math.abs(dx)>4)moved=true;
    if(moved)$("#board").scrollLeft=startScroll-dx;
  });
  window.addEventListener("mouseup",e=>{
    if(!dragging)return;
    dragging=false;
    $("#board").classList.remove("dragging");
    if(moved){
      // snap: 속도/방향으로 한 칸 이동
      const bd=$("#board"),secs=[...bd.querySelectorAll(".day")];
      const dx=e.clientX-startX;
      const cur=Math.round(startScroll/bd.clientWidth);
      if(Math.abs(dx)>40)carouselTo(dx<0?cur+1:cur-1);
      else carouselTo(cur);
    }
  });
}

  }catch(e){
    if(e?.code==="not_granted"){sample=null;toast("Claude 사용을 허용하면 위치를 자동으로 찾아요.")}
    else if(explicit)toast(e?.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 눌러 주세요.":"위치를 찾지 못했어요. 다시 눌러 주세요.");
  }
  finally{busy["loc"+id]=false;if(openId===id)render();else renderMap()}
}
async function loadNames(){
  if(!user)return;
  const ids=[...new Set(places.map(p=>p.by).filter(Boolean))].filter(id=>!(id in names));
  if(!ids.length)return;
  try{const ps=await user.profiles(ids);ids.forEach(id=>names[id]=ps[id]?.name||"");if(openId)render();}catch{}
}

async function addPlace(name,cat,day,time,memo,cand){
  name=name.trim(); if(!name)return;
  if(!db){toast("공유 저장소에 연결되지 않아 추가할 수 없어요.");return}
  const doc={name,cat,day,time:time||"",memo:memo||"",createdAt:Date.now()};
  if(cand)doc.cand=true;
  if(myId)doc.by=myId;
  const c=known(name);if(c){doc.lat=c[0];doc.lng=c[1]}
  try{const ref=await db.collection("places").add(doc);toast(`${name} 추가했어요`);if(!c&&cat!=="숙소")locate(ref.id,name)}
  catch(e){handleWriteErr(e)}
}
function handleWriteErr(e){
  if(e?.code==="invalid_argument"){readOnly=true;render();toast("보기 권한만 있어서 수정할 수 없어요.")}
  else if(e?.code==="quota_exceeded")toast("저장 공간이 가득 찼어요. 안 쓰는 장소를 지워 주세요.");
  else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
}
async function patch(id,data){try{await db.collection("places").doc(id).update(data)}catch(e){handleWriteErr(e)}}

async function getInfo(p){
  busy[p.id]=true;render();
  const prompt=`강원도 강릉 여행을 계획하고 있어. 장소: "${p.name}" (종류: ${p.cat}).
이 장소에 대해 여행자에게 도움이 되는 정보를 한국어로 간단히 정리해 줘. 잘 모르거나 불확실한 항목은 빈 문자열로 두고 지어내지 마.
오직 이 JSON 객체 하나로만 답해:
{"summary":"어떤 곳인지 1~2문장","area":"대략적인 위치/동네와 근처 명소","hours":"일반적인 운영 시간이나 추천 방문 시간대","cost":"입장료나 1인 예상 비용","stay":"보통 머무는 시간","tip":"알아두면 좋은 팁 1~2개","lat":37.78,"lng":128.9}
lat/lng는 대략적인 위도·경도 숫자이고, 모르면 null로 둬.`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    const info={};["summary","area","hours","cost","stay","tip"].forEach(k=>{if(r&&typeof r[k]==="string"&&r[k].trim())info[k]=r[k].trim().slice(0,400)});
    info.at=Date.now();
    const up={info};if(!p.pinned&&!isStay(p)&&r&&okCoord(+r.lat,+r.lng)){up.lat=+r.lat;up.lng=+r.lng;up.approx=false}
    await patch(p.id,up);
    if(!up.lat&&!okCoord(p.lat,p.lng)&&!isStay(p))locate(p.id,p.name,true);
  }catch(e){
    const m={not_granted:"Claude 사용을 허용해야 정보를 받을 수 있어요.",rate_limited:"요청이 많아요. 잠시 후 다시 눌러 주세요.",invalid_json:"정보를 정리하지 못했어요. 다시 눌러 주세요.",refused:"이 장소 정보는 받을 수 없었어요."};
    toast(m[e?.code]||"정보를 받지 못했어요. 다시 시도해 주세요.");
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code))sample=null;
  }finally{busy[p.id]=false;render()}
}

// events
$("#addForm").addEventListener("submit",e=>{e.preventDefault();
  addPlace($("#fName").value,$("#fCat").value,+$("#fDay").value,$("#fTime").value,$("#fMemo").value,$("#fCand").checked);
  $("#fName").value="";$("#fMemo").value="";$("#fTime").value="";$("#fCand").checked=false;$("#fName").focus();});
$("#ideas").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)addPlace(b.dataset.n,b.dataset.c,0,"","")});
$("#board").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.closest(".card").dataset.id, p=places.find(x=>x.id===id);if(!p)return;
  const a=b.dataset.act;
  if(a==="toggle"){openId=openId===id?null:id;render();loadNames()}
  else if(a==="info")getInfo(p);
  else if(a==="find")locate(id,p.name,true);
  else if(a==="pick"){pickId=id;renderMap();document.querySelector(".mapbox").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})}
  else if(a==="del"){busy["del"+id]=true;render()}
  else if(a==="del0"){busy["del"+id]=false;render()}
  else if(a==="del2"){busy["del"+id]=false;openId=null;db.collection("places").doc(id).delete().then(()=>toast(`${p.name} 삭제했어요`)).catch(handleWriteErr)}
});
$("#board").addEventListener("change",e=>{
  const f=e.target.dataset.f;if(!f)return;
  const id=e.target.closest(".card").dataset.id;
  const v=f==="day"?+e.target.value:f==="cand"?e.target.checked:e.target.value;
  patch(id,{[f]:v});
});
$("#mapHead").addEventListener("click",e=>{const b=e.target.closest("[data-md]");if(b){mapDay=b.dataset.md;renderMap()}});
function openFromMap(id){openId=id;render();loadNames();const c=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);c?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"})}
$("#map").addEventListener("click",e=>{
  if(pickId){const svg=$("#map svg");if(!svg||!proj)return;
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    const lat=+(proj.cLat-(q.y-proj.H/2)/proj.s).toFixed(5),lng=+(proj.cLng+(q.x-proj.W/2)/(proj.k*proj.s)).toFixed(5);
    const id=pickId,nm=places.find(p=>p.id===id)?.name||"";pickId=null;
    if(okCoord(lat,lng))patch(id,{lat,lng,pinned:true,approx:false}).then(()=>toast(`${nm} 위치를 찍었어요`));else{toast("강릉 근처를 눌러 주세요");renderMap()}
    return}
  const g=e.target.closest(".mk");if(g)openFromMap(g.dataset.pid)});
$("#mapNote").addEventListener("click",e=>{
  if(e.target.closest('[data-act="pickcancel"]')){pickId=null;renderMap()}
  if(e.target.closest('[data-act="locall"]')){places.filter(p=>!okCoord(p.lat,p.lng)&&!isStay(p)).slice(0,5).forEach(p=>locate(p.id,p.name))}});
$("#map").addEventListener("keydown",e=>{const g=e.target.closest(".mk");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openFromMap(g.dataset.pid)}});
let tripTimer;
function saveTrip(){clearTimeout(tripTimer);tripTimer=setTimeout(async()=>{
  const days=Math.max(1,Math.min(10,+$("#days").value||1));
  if(!db)return;try{await db.doc("meta/trip").set({days,start:$("#start").value||""})}catch(e){handleWriteErr(e)}},500)}
$("#days").addEventListener("input",()=>{trip.days=Math.max(1,Math.min(10,+$("#days").value||1));renderForm();render();saveTrip()});
$("#start").addEventListener("change",()=>{trip.start=$("#start").value;render();saveTrip()});

renderForm();render();

// ---- 서버 연결 (Supabase REST) ----
// 라이브러리 없이 fetch 로 Supabase REST API 를 직접 호출합니다. (GitHub Pages 같은 정적 호스팅에 그대로 올라감)
// 화면 코드가 쓰는 db / sample 인터페이스를 Firebase 모양으로 흉내 내서, 위쪽 코드는 그대로 둡니다.
const CFG=window.APP_CONFIG||{};
const SB_URL=(CFG.supabaseUrl||"").replace(/\/+$/,"");
const SB_KEY=CFG.supabaseAnonKey||"";
const REST=SB_URL+"/rest/v1";
const POLL_MS=CFG.pollMs||4000;
// 편집 암호: config.js 의 editKey 가 있으면, 사용자가 같은 값을 한 번 입력해야 편집 가능 (브라우저에 기억)
const APP_EDIT_KEY=(CFG.editKey||"").trim();
const KEY_STORE="gangneung-edit-key";
function getKey(){try{return localStorage.getItem(KEY_STORE)||""}catch{return ""}}
function setKey(v){try{v?localStorage.setItem(KEY_STORE,v):localStorage.removeItem(KEY_STORE)}catch{}}
let needKey=!!APP_EDIT_KEY;
// 쓰기 전에 편집 암호 확인 (클라이언트 측 간단 잠금). 읽기는 누구나.
function ensureEditAllowed(){
  if(!APP_EDIT_KEY)return true;
  if(getKey()===APP_EDIT_KEY)return true;
  const v=window.prompt("편집하려면 편집 암호를 입력해 주세요.");
  if(v&&v.trim()===APP_EDIT_KEY){setKey(v.trim());return true}
  if(v!==null)toast("편집 암호가 맞지 않아요.");
  throw {code:"invalid_argument",message:"편집 암호가 필요해요."};
}
// Supabase REST 호출
async function sb(method,pathAndQuery,body,extraHeaders){
  if(!SB_URL||!SB_KEY)throw {code:"unavailable",message:"Supabase 설정이 없어요."};
  const headers={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"content-type":"application/json",...(extraHeaders||{})};
  let r;
  try{r=await fetch(REST+pathAndQuery,{method,headers,body:body?JSON.stringify(body):undefined})}
  catch{throw {code:"unavailable",message:"서버에 연결할 수 없어요."}}
  if(r.status===401||r.status===403)throw {code:"invalid_argument",message:"권한이 없어요. (키/정책 확인)"};
  if(!r.ok){let m="오류 "+r.status;try{m=(await r.json()).message||m}catch{}throw {code:"upstream_error",message:m}}
  if(r.status===204)return null;
  try{return await r.json()}catch{return null}
}

// 상태 폴링: places 테이블과 trip(1행)을 주기적으로 읽어 구독자에게 전달
const subs={places:[],trip:[]};let pollTimer=null;
async function refresh(){
  try{
    const [placesRows,tripRows]=await Promise.all([
      sb("GET","/places?select=*&order=created_at.asc"),
      sb("GET","/trip?id=eq.1&select=*"),
    ]);
    sample=null; // Supabase 버전은 AI(Claude) 기능 없음
    const t=(tripRows&&tripRows[0])||{};
    const tripSnap={exists:true,data:()=>({days:t.days??2,start:t.start||""})};
    // DB 행(snake/ JSON) → 화면이 쓰는 모양으로
    const placeSnap={docs:(placesRows||[]).map(row=>({
      id:row.id,
      data:()=>({
        name:row.name,cat:row.cat,day:row.day,time:row.time||"",memo:row.memo||"",
        lat:row.lat??undefined,lng:row.lng??undefined,
        pinned:row.pinned||undefined,cand:row.cand||undefined,approx:row.approx??undefined,
        by:row.by||undefined,createdAt:row.created_at?Date.parse(row.created_at):undefined,
        info:row.info||undefined,
      }),
    }))};
    subs.trip.forEach(f=>f(tripSnap));subs.places.forEach(f=>f(placeSnap));
    if(!readOnly)$("#status").textContent=`함께 보는 중 · ${(placesRows||[]).length}곳`;
  }catch(e){$("#status").textContent="서버에 연결할 수 없어요. 잠시 후 다시 시도해요.";}
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden)refresh()},POLL_MS)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
const after=(p)=>p.then(v=>{refresh();return v});

// 화면 코드가 쓰는 필드 → DB 컬럼으로 변환 (createdAt→created_at 등)
function toRow(doc){
  const r={};
  if("name" in doc)r.name=doc.name;
  if("cat" in doc)r.cat=doc.cat;
  if("day" in doc)r.day=doc.day;
  if("time" in doc)r.time=doc.time;
  if("memo" in doc)r.memo=doc.memo;
  if("lat" in doc)r.lat=doc.lat;
  if("lng" in doc)r.lng=doc.lng;
  if("pinned" in doc)r.pinned=doc.pinned;
  if("cand" in doc)r.cand=doc.cand;
  if("approx" in doc)r.approx=doc.approx;
  if("by" in doc)r.by=doc.by;
  if("info" in doc)r.info=doc.info;
  if("createdAt" in doc)r.created_at=new Date(doc.createdAt).toISOString();
  return r;
}
function makeDb(){
  return {
    collection(name){
      if(name!=="places")throw new Error("unknown collection "+name);
      return {
        add:(doc)=>{ensureEditAllowed();return after(
          sb("POST","/places",toRow(doc),{Prefer:"return=representation"})
        ).then(rows=>({id:rows&&rows[0]&&rows[0].id}))},
        doc:(id)=>({
          update:(data)=>{ensureEditAllowed();return after(
            sb("PATCH","/places?id=eq."+encodeURIComponent(id),toRow(data)))},
          delete:()=>{ensureEditAllowed();return after(
            sb("DELETE","/places?id=eq."+encodeURIComponent(id)))},
        }),
        onSnapshot:(next)=>{subs.places.push(next);return()=>{}},
      };
    },
    doc(path){
      if(path!=="meta/trip")throw new Error("unknown doc "+path);
      return {
        set:(data)=>{ensureEditAllowed();return after(
          sb("POST","/trip?on_conflict=id",{id:1,days:data.days,start:data.start||null},
             {Prefer:"resolution=merge-duplicates"}))},
        onSnapshot:(next)=>{subs.trip.push(next);return()=>{}},
      };
    },
  };
}

(async()=>{
  if(!SB_URL||!SB_KEY||SB_URL.includes("xxxxxxxx")){
    $("#status").textContent="config.js 에 Supabase URL/키를 넣어 주세요.";$("#addBtn").disabled=true;return;
  }
  db=makeDb();sample=null;user=null;
  db.doc("meta/trip").onSnapshot(s=>{
    if(s.exists){const d=s.data();trip.days=Math.max(1,Math.min(10,+d.days||2));trip.start=d.start||"";
      if(document.activeElement!==$("#days"))$("#days").value=trip.days;
      if(document.activeElement!==$("#start"))$("#start").value=trip.start;}
    renderForm();render();
  });
  db.collection("places").onSnapshot(s=>{
    places=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!readOnly)$("#status").textContent=`함께 보는 중 · ${places.length}곳`;
    const a=document.activeElement;if(a&&a.dataset&&(a.dataset.f==="memo"||a.dataset.f==="time"))return;
    render();
  });
  await refresh();startPolling();
})();
